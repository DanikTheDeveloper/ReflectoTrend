# nginx server block for reflecto-trend.from-delhi.net.
#
# Host-level reverse proxy for the Docker deployment. Each site on the VPS
# owns one file in /etc/nginx/sites-available, symlinked into sites-enabled
# via infra/install-nginx.sh. All sites share the host's single nginx
# (see /etc/nginx/nginx.conf: `include sites-enabled/*`).
#
# TLS is terminated by Cloudflare (DNS proxied), so this listens on plain
# HTTP and only ever sees Cloudflare origin fetches. Both app tiers run in
# Docker (docker compose up -d): frontend on 127.0.0.1:8081 (nginx serving
# the static build) and backend on 127.0.0.1:8080 (Go API). This block
# just proxies to those loopback ports — no `root` on the host.
#
# Docker ports are bound to 127.0.0.1 only (see docker-compose.yaml), so the
# containers are not reachable from the public internet except through this
# host nginx. The frontend container's own nginx (nginx/conf.d/default.conf)
# still serves / and proxies /api|/auth to backend:8080 internally, so
# `docker compose up` works standalone without host nginx (local dev).

server {
    listen 80;
    listen [::]:80;
    server_name reflecto-trend.from-delhi.net www.reflecto-trend.from-delhi.net;

    client_max_body_size 50M;

    # API + auth — Go backend container (also reachable via frontend's
    # internal proxy, but host-level split avoids the extra hop in prod).
    location ~ ^/(api|auth) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend — nginx container serving the static build.
    # Includes SPA fallback and /images alias inside the container
    # (see nginx/conf.d/default.conf); host just proxies.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
